name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 扫描全仓疑似密钥/凭证
        run: bash scripts/scan-secrets.sh --all
      - name: 校验注入脚本语法
        run: bash -n scripts/inject-config.sh scripts/scan-secrets.sh

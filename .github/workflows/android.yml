name: build-android

on:
  push:
    branches: [main]
    paths: ['android/**', 'shared/**', 'scripts/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'shared/**', 'scripts/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 已预装 Android SDK，直接复用，避免 setup-android 下载失败
      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found (tried $SDK)"; exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "Using Android SDK: $SDK"
          ls "$SDK" | head -20

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Gradle 版本
        run: gradle --version

      # 域名等构建配置来自仓库变量/密钥，绝不进仓库
      - name: 注入构建配置
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL || vars.API_BASE_URL }}
          API_ALLOW_CLEARTEXT: ${{ vars.API_ALLOW_CLEARTEXT || 'false' }}
          ANDROID_APP_ID: ${{ vars.ANDROID_APP_ID }}
          REGISTRATION_URL: ${{ vars.REGISTRATION_URL }}
          QUIET: '1'
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::缺少 API_BASE_URL（Settings → Secrets and variables → Actions）"; exit 1
          fi
          ANDROID_SDK_DIR="$ANDROID_SDK_ROOT" bash scripts/inject-config.sh

      - name: 构建 Release
        working-directory: android
        run: |
          set -o pipefail
          if [ -x ./gradlew ]; then CMD=./gradlew; else CMD=gradle; fi
          echo "Using: $CMD"
          $CMD :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: 输出构建错误
        if: failure()
        working-directory: android
        run: |
          echo "## Android build errors" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build.log ]; then
            grep -nE 'Missing class|R8|Compilation failed|ERROR:|error:|e: |FAILURE:|What went wrong|Unresolved reference|Execution failed|Could not|Caused by|> Task .* FAILED' build.log | tail -60 | while IFS= read -r line; do
              echo "::error file=android/${line%%:*},line=1::${line}"
            done
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -120 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::build.log not found"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exam-mobile-android-build-log
          path: android/build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: exam-mobile-android-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

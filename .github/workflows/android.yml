name: build-android

on:
  push:
    branches: [main]
    paths: ['android/**', 'shared/**', 'scripts/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'shared/**', 'scripts/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 已预装 Android SDK，直接复用，避免 setup-android 下载失败
      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found (tried $SDK)"; exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "Using Android SDK: $SDK"
          ls "$SDK" | head -20

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 域名等构建配置来自仓库变量/密钥，绝不进仓库
      - name: 注入构建配置
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL || vars.API_BASE_URL }}
          API_ALLOW_CLEARTEXT: ${{ vars.API_ALLOW_CLEARTEXT || 'false' }}
          ANDROID_APP_ID: ${{ vars.ANDROID_APP_ID }}
          REGISTRATION_URL: ${{ vars.REGISTRATION_URL }}
          QUIET: '1'
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::缺少 API_BASE_URL（Settings → Secrets and variables → Actions）"; exit 1
          fi
          ANDROID_SDK_DIR="$ANDROID_SDK_ROOT" bash scripts/inject-config.sh

      - name: 生成 Gradle Wrapper（首次）
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: 构建 Debug
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: exam-mobile-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

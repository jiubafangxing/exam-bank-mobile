name: build-harmony

# HarmonyOS Next（API 12+）使用 ArkTS/hvigor 构建。
# GitHub 托管 ubuntu runner 通过 ErBWs/setup-ohos 安装命令行工具链后可直接 assembleHap，
# 全程在云端完成，不消耗本地 CPU/内存。公开仓库托管 runner 免费。
on:
  push:
    branches: [main]
    paths: ['harmony/**', 'shared/**', 'scripts/**', '.github/workflows/harmony.yml']
  pull_request:
    paths: ['harmony/**', 'shared/**', 'scripts/**', '.github/workflows/harmony.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: HarmonyOS HAP
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # hvigor/ohpm 依赖 JDK 17
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # setup-ohos 需要 libGL1（Linux）
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      # 安装 HarmonyOS 命令行工具链（hvigorw / ohpm / SDK），带缓存
      - name: 安装 HarmonyOS CLI 工具链
        uses: ErBWs/setup-ohos@v2
        with:
          version: ${{ vars.HARMONY_CLI_VERSION || '6.1.1.280' }}
          cache: true

      - name: 校验工具链
        run: |
          hvigorw -v
          ohpm -v

      # 域名等构建配置来自 secrets/vars，绝不进仓库，也不在日志打印
      - name: 注入构建配置
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL || vars.API_BASE_URL }}
          API_ALLOW_CLEARTEXT: ${{ vars.API_ALLOW_CLEARTEXT || 'false' }}
          HARMONY_BUNDLE_NAME: ${{ vars.HARMONY_BUNDLE_NAME }}
          REGISTRATION_URL: ${{ vars.REGISTRATION_URL }}
          QUIET: '1'
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::缺少 API_BASE_URL（Settings → Secrets and variables → Actions）"; exit 1
          fi
          bash scripts/inject-config.sh

      - name: 安装 ohpm 依赖
        working-directory: harmony
        run: ohpm install --all

      - name: 构建 HAP（debug，免签名）
        working-directory: harmony
        run: |
          hvigorw clean --no-daemon
          hvigorw --mode module -p product=default -p buildMode=debug \
            assembleHap --no-daemon

      - name: 归档 HAP
        uses: actions/upload-artifact@v4
        with:
          name: exam-mobile-harmony-hap
          path: |
            harmony/entry/build/**/outputs/**/*.hap
            harmony/entry/build/**/outputs/**/*.app
          if-no-files-found: error

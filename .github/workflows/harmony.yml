name: build-harmony

# HarmonyOS Next（API 12+）使用 ArkTS/hvigor 构建。
# GitHub 托管 ubuntu runner 通过 ErBWs/setup-ohos 安装命令行工具链后可直接 assembleHap，
# 全程在云端完成，不消耗本地 CPU/内存。公开仓库托管 runner 免费。
on:
  push:
    branches: [main]
    paths: ['harmony/**', 'shared/**', 'scripts/**', '.github/workflows/harmony.yml']
  pull_request:
    paths: ['harmony/**', 'shared/**', 'scripts/**', '.github/workflows/harmony.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: HarmonyOS HAP
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      - name: 安装 HarmonyOS CLI 工具链
        uses: ErBWs/setup-ohos@v2
        with:
          version: ${{ vars.HARMONY_CLI_VERSION || '6.1.1.280' }}
          cache: true

      - name: 配置 Huawei npm 源
        run: |
          cat > "$HOME/.npmrc" <<'EOF'
          registry=https://repo.huaweicloud.com/repository/npm/
          @ohos:registry=https://repo.harmonyos.com/npm/
          EOF
          cat "$HOME/.npmrc"

      - name: 校验工具链
        run: |
          hvigorw -v
          ohpm -v

      - name: 注入构建配置
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL || vars.API_BASE_URL }}
          API_ALLOW_CLEARTEXT: ${{ vars.API_ALLOW_CLEARTEXT || 'false' }}
          HARMONY_BUNDLE_NAME: ${{ vars.HARMONY_BUNDLE_NAME }}
          REGISTRATION_URL: ${{ vars.REGISTRATION_URL }}
          QUIET: '1'
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::缺少 API_BASE_URL（Settings → Secrets and variables → Actions）"; exit 1
          fi
          bash scripts/inject-config.sh

      - name: 安装 ohpm 依赖
        working-directory: harmony
        run: |
          set -o pipefail
          ohpm install --all 2>&1 | tee build.log

      - name: 构建 HAP（debug，免签名）
        working-directory: harmony
        run: |
          set -o pipefail
          hvigorw clean --no-daemon 2>&1 | tee -a build.log || true
          hvigorw --mode module -p product=default -p buildMode=release \
            assembleHap --no-daemon --stacktrace 2>&1 | tee -a build.log

      - name: 输出构建错误
        if: failure()
        working-directory: harmony
        run: |
          echo "## HarmonyOS build errors" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build.log ]; then
            i=0
            grep -E 'Error Message:|At File:|ERROR: 1[0-9]{7}|COMPILE RESULT' build.log | tail -80 | while IFS= read -r line; do
              i=$((i+1))
              echo "::error::H${i}: ${line}"
              if [ "$i" -ge 10 ]; then break; fi
            done
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -220 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::build.log not found"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exam-mobile-harmony-build-log
          path: harmony/build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: exam-mobile-harmony-hap
          path: |
            harmony/entry/build/**/outputs/**/*.hap
            harmony/entry/build/**/outputs/**/*.app
          if-no-files-found: error
